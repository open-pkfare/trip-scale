      recent-focus-destinations:
        - "Japan"
        - "Europe"
        - "Southeast Asia"
        - "New Zealand"
      travel-styles:
        - "Cultural"
        - "Adventure"
        - "Relaxation"
        - "Food & Drink"
        - "Photography"
      likes:
