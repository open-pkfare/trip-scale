server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: spring-boot-framework

logging:
  level:
    com.pkfare.tripscale: INFO
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# External service configurations
external:
  dify:
    base-url: ${DIFY_BASE_URL:http://localhost:8001}
    api-key: ${DIFY_API_KEY:mock-api-key}
    timeout-seconds: 30
    max-retries: 3
    retry-delay-ms: 1000
  
  memory:
    base-url: ${MEMORY_BASE_URL:http://localhost:8002}
    api-key: ${MEMORY_API_KEY:mock-api-key}
    timeout-seconds: 15
    max-retries: 3
    retry-delay-ms: 500
  
  trip-knowledge:
    base-url: ${TRIP_KNOWLEDGE_BASE_URL:http://localhost:8003}
    api-key: ${TRIP_KNOWLEDGE_API_KEY:mock-api-key}
    timeout-seconds: 20
    max-retries: 3
    retry-delay-ms: 1000

# MCP server configuration
mcp:
  server:
    name: ${MCP_SERVER_NAME:tripscale-destination-recommendations}
    version: ${MCP_SERVER_VERSION:1.0.0}
    description: ${MCP_SERVER_DESCRIPTION:TripScale destination recommendation MCP service}
    enabled: ${MCP_SERVER_ENABLED:true}
    max-suggestions: ${MCP_MAX_SUGGESTIONS:10}
    request-timeout-seconds: ${MCP_REQUEST_TIMEOUT:30}
    logging-enabled: ${MCP_LOGGING_ENABLED:true}

# Mock data configuration for MemoryService
mock:
