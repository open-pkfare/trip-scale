server:
  port: 8802
  servlet:
    context-path: /

spring:
  application:
    name: trip-scale
  ai:
    mcp:
      server:
        enabled: true
        port: 8803
        name: "tripscale-mcp-server"
        description: "TripScale relevant MCP server"

# Mock data configuration for MemoryService
